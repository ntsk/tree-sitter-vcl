name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action/cli@v2
      - uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
          node-version: "22"
      - name: Parse example.vcl
        run: tree-sitter parse example.vcl --quiet
